name: Update home page list and sitemap

on:
  push:
    branches: [main, master]
    paths:
      - 'article-*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild article list and sitemap
        run: python3 update_site.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Auto-update home page list and sitemap"
            git push
          fi
